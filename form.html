<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <form border="5" align="center">
        <tr>
            <td>Roll Number: </td>
            <td><input type="text"></td>
        </tr>
        <br><br>
        <tr>
            <td>Student Name: </td>
            <td><input type="text" placeholder="First Name"></td>
            <td><input type="text" placeholder="Last Name"></td>
        </tr>
        <br><br>
        <tr>
            <td>Father's Name: </td>
            <td><input type="text"></td>
        </tr>
        <br><br>
        <tr>
           <td>Date Of Birth: </td>
           <td><input type="number" placeholder="Day"></td>
           <td><input type="number" placeholder="Month"></td> 
           <td><input type="number" placeholder="Year"></td>
           <td>(DD.MM.YYYY)</td>
        </tr>
        <br><br>
        <tr>
            <td>Mobile Number: </td>
            <td><input placeholder="+91"></td>
            <td><input type="text"></td>
        </tr>
        <br><br>
        
    </form>
</body>
</html>
